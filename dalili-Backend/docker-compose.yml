services:
  database:
    image: postgres:17
    environment:
      POSTGRES_USER: nada
      POSTGRES_PASSWORD: dalili123
      POSTGRES_DB: dalili_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
  redis:
    image: redis:7-alpine
    container_name: dalili-redis
    ports:
      - "6379:6379"

volumes:
  postgres_data: